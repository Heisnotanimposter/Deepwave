<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Lee | Multi-lingual Portfolio & Blog</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Simon Lee's professional portfolio and blog. Showcasing robotics, computer science, bioengineering projects, running services, and research updates in multiple languages." />
    <meta name="author" content="Simon Lee (Seungwon Lee)" />
    
    <!-- CSS Stylesheet & Google Fonts -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Navigation Header -->
    <header class="main-header">
        <div class="nav-container">
            <a href="#/portfolio" class="logo" id="logo-anchor">
                <span id="logo-text">Simon</span>
                <span class="logo-dot"></span>
            </a>
            
            <nav>
                <ul class="nav-menu">
                    <li><a href="#/portfolio" class="nav-link active" data-ui-key="nav_portfolio">Portfolio</a></li>
                    <li><a href="#/blog" class="nav-link" data-ui-key="nav_blog">Blog</a></li>
                    <li><a href="#/admin" class="nav-link" data-ui-key="nav_admin">Admin</a></li>
                </ul>
            </nav>

            <div class="nav-controls">
                <!-- Multi-language Select Buttons -->
                <div class="lang-selector" id="header-lang-selector">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="kor">한</button>
                    <button class="lang-btn" data-lang="jp">日</button>
                    <button class="lang-btn" data-lang="chn">中</button>
                </div>
                
                <!-- Dark / Light Theme Toggle -->
                <button class="theme-toggle" id="theme-toggle" title="Switch Theme">☀️</button>
            </div>
        </div>
    </header>

    <!-- 1. PORTFOLIO VIEW -->
    <main id="portfolio-view">
        <!-- Hero Section -->
        <section class="hero-sec" id="hero-container">
            <!-- Rendered Dynamically in app.js -->
        </section>

        <!-- Summary Section -->
        <section class="container" id="summary-sec">
            <div class="sec-header">
                <h2 class="sec-title" data-ui-key="sec_summary">Summary</h2>
            </div>
            <div class="glass-card" id="summary-container" style="font-size: 1.15rem; line-height: 1.8;">
                <!-- Rendered Dynamically in app.js -->
            </div>
            
            <!-- Dynamic Contact/Profile Details -->
            <div class="contact-grid" id="profile-details-grid">
                <!-- Rendered Dynamically in app.js -->
            </div>
        </section>

        <!-- Projects Section -->
        <section class="container" id="projects-sec">
            <div class="sec-header">
                <h2 class="sec-title" data-ui-key="sec_projects">Featured Projects</h2>
            </div>
            <div class="projects-grid" id="projects-grid">
                <!-- Rendered Dynamically in app.js -->
            </div>
        </section>

        <!-- Active Running Services Section -->
        <section class="container" id="services-sec">
            <div class="sec-header">
                <h2 class="sec-title" data-ui-key="sec_services">Active Services</h2>
            </div>
            <div class="services-grid" id="services-grid">
                <!-- Rendered Dynamically in app.js -->
            </div>
        </section>

        <!-- Certifications Section -->
        <section class="container" id="certs-sec">
            <div class="sec-header">
                <h2 class="sec-title" data-ui-key="sec_certs">Certifications</h2>
            </div>
            <div class="certs-container" id="certs-container">
                <!-- Rendered Dynamically in app.js -->
            </div>
        </section>

        <!-- Languages & Presence Section -->
        <section class="container" id="links-anchor">
            <div class="sec-header">
                <h2 class="sec-title" data-ui-key="sec_langs_presence">Skills & Online Presence</h2>
            </div>
            <div class="split-grid">
                <div>
                    <h3 data-ui-key="sec_langs" style="font-size: 1.4rem; margin-bottom: 1rem;">Languages</h3>
                    <div class="langs-list" id="langs-list">
                        <!-- Rendered Dynamically in app.js -->
                    </div>
                </div>
                <div>
                    <h3 data-ui-key="sec_links" style="font-size: 1.4rem; margin-bottom: 1rem;">Online Presence</h3>
                    <div class="links-list" id="links-list">
                        <!-- Rendered Dynamically in app.js -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 2. BLOG LIST VIEW -->
    <main id="blog-view" class="hidden" style="padding-top: 100px;">
        <section class="container">
            <div class="sec-header">
                <h2 class="sec-title" data-ui-key="nav_blog">Blog</h2>
            </div>
            
            <!-- Controls: Category selectors and search input -->
            <div class="blog-controls">
                <div class="blog-categories" id="blog-categories">
                    <!-- Rendered Dynamically in app.js -->
                </div>
                <div class="blog-search">
                    <span class="blog-search-icon">🔍</span>
                    <input type="text" id="blog-search-input" data-ui-key="search_placeholder" placeholder="Search posts..." />
                </div>
            </div>

            <!-- Blog Post Grid -->
            <div class="blog-grid" id="blog-grid">
                <!-- Rendered Dynamically in app.js -->
            </div>
        </section>
    </main>

    <!-- 3. DETAILED BLOG POST VIEW -->
    <main id="blog-post-view" class="hidden">
        <!-- Rendered Dynamically in app.js -->
    </main>

    <!-- 4. ADMIN CMS VIEW -->
    <main id="admin-view" class="hidden">
        <!-- Rendered Dynamically in admin.js -->
    </main>

    <!-- Global Footer -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 <span data-ui-key="footer_rights">Rights Reserved By Simon Lee</span></p>
        </div>
    </footer>

    <!-- App Logic Module -->
    <script src="app.js"></script>
</body>
</html>
